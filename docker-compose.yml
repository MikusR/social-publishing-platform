services:
    app:
        build: .
        container_name: laravel-app
        restart: unless-stopped
        working_dir: /var/www
        user: www-data
        volumes:
            # Use named volumes for directories that need write access
            - ./:/var/www:cached
            - laravel-storage:/var/www/storage
            - laravel-cache:/var/www/bootstrap/cache
            - laravel-database:/var/www/database
        environment:
            - DB_CONNECTION=sqlite
            - DB_DATABASE=/var/www/database/database.sqlite

    nginx:
        image: nginx:latest
        container_name: laravel-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www:cached
            - laravel-storage:/var/www/storage:cached
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

volumes:
    laravel-storage:
    laravel-cache:
    laravel-database:
